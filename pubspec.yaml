name: jackdaw
description: "Jackdaw — the mobile client for Mantle brains: chat, notifications, and message-attached location."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.12.1+24

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.9
  shadcn_ui: ^0.54.0
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  drift: ^2.34.0
  # sqlite3 3.x bundles the native SQLite library via Dart hooks (native
  # assets), so the old `sqlite3_flutter_libs` (EOL — a no-op past sqlite3 2.x)
  # is gone. We don't import sqlite3 directly (drift's NativeDatabase does); the
  # dep is listed to make the native bundling explicit.
  sqlite3: ^3.3.3
  path_provider: ^2.1.6
  path: ^1.9.1
  dio: ^5.9.2
  flutter_secure_storage: ^10.3.1
  go_router: ^17.3.0
  # Markdown rendering for assistant replies. flutter_markdown_plus is the
  # maintained fork of the archived flutter_markdown; it bundles the `markdown`
  # parser, which we depend on directly so we can register Mantle's custom
  # syntaxes (callouts, color spans) in later phases. See docs/architecture.md.
  flutter_markdown_plus: ^1.0.7
  markdown: ^7.3.1
  url_launcher: ^6.3.2
  flutter_svg: ^2.3.0
  image_picker: ^1.2.2
  # Was pinned to 8.x: 11.x relied on AGP 9 built-in Kotlin, which this app
  # doesn't enable (android/gradle.properties), so the Android plugin jar came
  # out empty. Fixed upstream in 12.0.0-beta.3: android_file_picker applies
  # the Kotlin plugin itself when android.builtInKotlin=false.
  file_picker: ^13.1.0
  record: ^7.1.0
  mobile_scanner: ^7.4.2
  mime: ^2.0.0
  just_audio: ^0.10.5
  sodium: ^4.0.2+1
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.0
  flutter_local_notifications: ^22.0.1
  # Event alarms: zonedSchedule needs TZDateTime. Alarms are absolute instants,
  # so we schedule in UTC — no local-timezone plugin needed.
  timezone: ^0.11.0
  flutter_foreground_task: ^9.2.2
  geolocator: ^14.0.2
  battery_plus: ^7.0.0
  flutter_math_fork: ^0.7.4
  re_highlight: ^0.0.3
  # 10.x because file_picker 13 needs win32 6 and 9.x holds win32 at 5.
  # If a build ever fails with "cannot find symbol PackageInfoPlugin" in
  # GeneratedPluginRegistrant, delete build/package_info_plus and rebuild:
  # a stale module build dir from an older version left an empty jar once.
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  riverpod_generator: ^4.0.4
  freezed: ^3.2.5
  json_serializable: ^6.14.0
  drift_dev: ^2.34.0
  # NOTE: riverpod_lint / custom_lint dropped — custom_lint is still pinned to
  # analyzer ^8, which conflicts with drift_dev 2.34 (needs analyzer >=10).
  # Re-add once custom_lint supports analyzer 10+.
  mocktail: ^1.0.5
  path_provider_platform_interface: ^2.1.3
  plugin_platform_interface: ^2.1.8
  # App-icon + splash generation (dev-only). `image` is used by
  # tool/generate_app_icon.dart and tool/generate_splash.dart to compose the
  # masters; flutter_launcher_icons / flutter_native_splash fan them out to all
  # platforms.
  image: ^4.3.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.4

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # Disable LLDB on-device debugging — it's slow to attach on iOS 17+ devices.
  # The app still runs and hot reload still works; we just skip step-debugging
  # on a physical device.
  config:
    enable-lldb-debugging: false

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  fonts:
    # Mantle's wordmark/logo font (Bukhari Script), copied from
    # apps/web/public/fonts. Used for the agent name in the chat header.
    - family: BukhariScript
      fonts:
        - asset: assets/fonts/BukhariScript-Regular.ttf

  assets:
    # The Jackdaw wordmark. A single flat colour (#FDE7BC) on transparent, which
    # is what lets JackdawWordmark tint it to a theme token with BlendMode.srcIn
    # instead of shipping one PNG per theme.
    - assets/brand/jackdaw_wordmark.png
    # The full badge+wordmark lockup. Two files, not one tinted file: the badge
    # is illustrated artwork and srcIn would flatten it to a silhouette.
    # dark/light name the BACKGROUND each is drawn for. Composed by
    # tool/generate_lockups.dart.
    - assets/brand/jackdaw_lockup_dark.png
    - assets/brand/jackdaw_lockup_light.png

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# App icon generation. The masters are composed by tool/generate_app_icon.dart
# from branding/jackdaw-icon-logo-dark-trans.png (the full-colour jackdaw badge
# with the cream ring). Colour is preserved — the badge is illustrated artwork.
# Run:
#   fvm dart run tool/generate_app_icon.dart   # (re)build the masters
#   fvm dart run flutter_launcher_icons        # fan out to iOS + Android
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  # iOS forbids alpha; the master is already opaque, but flatten to be safe.
  remove_alpha_ios: true
  background_color_ios: "#2D1500"
  # Android adaptive icon: the badge over Jackdaw brand brown.
  adaptive_icon_background: "#2D1500"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

# Launch / splash screen. Reuses the dark-background lockup the app itself
# shows on its auth screens, composed by tool/generate_lockups.dart. Run:
#   fvm dart run tool/generate_lockups.dart         # (re)build both lockups
#   fvm dart run flutter_native_splash:create       # fan out to iOS + Android
# Brand brown (#2D1500) background with the centered badge + cream wordmark,
# identical in light and dark so dark-mode launches don't flash white. The
# Android 12+ splash masks its image to a circle, so it reuses the badge-only
# icon foreground instead of the wide lockup.
flutter_native_splash:
  color: "#2D1500"
  color_dark: "#2D1500"
  image: assets/brand/jackdaw_lockup_dark.png
  image_dark: assets/brand/jackdaw_lockup_dark.png
  ios_content_mode: center
  android_12:
    color: "#2D1500"
    color_dark: "#2D1500"
    image: assets/icon/app_icon_foreground.png
    image_dark: assets/icon/app_icon_foreground.png
