org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template.
# Keep it false: the app module and most plugins here still apply KGP, which
# AGP 9 rejects once built-in Kotlin is on. Consequence: a plugin that does
# NOT apply KGP under AGP 9 silently skips Kotlin compilation (classes.jar
# holds only R.class). file_picker 11.x did that and was pinned to 8.x;
# android_file_picker >= 2.0 applies KGP itself when this flag is false, so
# the pin is gone. flutter_foreground_task 11 needs this flag ON, which is
# the built-in Kotlin migration, not done yet.
android.builtInKotlin=false
