org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template.
# Keep it false: the app module and most plugins here still apply KGP, which
# AGP 9 rejects once built-in Kotlin is on. Consequence: plugins that DON'T
# apply KGP under AGP 9 (file_picker >= 11) silently skip Kotlin compilation
# (classes.jar holds only R.class) — hence file_picker is pinned to 8.x until
# the app migrates to built-in Kotlin wholesale.
android.builtInKotlin=false
