# The gate. Every push and pull request runs what a careful developer runs by
# hand before a commit: analyze, test, generated code up to date, and both
# release builds compile. Nothing here signs or publishes.
#
# The Android build needs a google-services.json, which is git-ignored (the
# real one is per Firebase project). CI uses the placeholder under tool/ci so
# the Gradle plugin is satisfied; the app never runs here, so nothing reads it.

name: verify

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: analyze, test, codegen, android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version

      - run: flutter pub get

      - name: Generated code is committed and current
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- '*.g.dart' \
            || { echo '::error::Generated files are stale. Run: fvm dart run build_runner build'; exit 1; }

      - name: Theme port is current
        # lib/theme/mantle_themes.g.dart is generated from the copy of mantle's
        # theme sources under tool/themes/ (not by build_runner). A stale port
        # fails here; freshness of the copy itself is the themes-upstream job.
        run: dart run tool/generate_themes.dart --check

      - run: flutter analyze

      - run: flutter test

      - name: Placeholder Firebase config
        run: |
          if [ ! -f android/app/google-services.json ]; then
            cp tool/ci/google-services.ci.json android/app/google-services.json
          fi

      - name: Android release APK compiles
        run: flutter build apk --release

  ios:
    name: ios build (no codesign)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: iOS release compiles
        run: flutter build ios --release --no-codesign

  themes-upstream:
    # The copy of mantle's theme sources under tool/themes/ must match what
    # mantle main ships, or a theme changed on the web is silently missing on
    # the phone. Fails the build on drift: run tool/sync_themes.sh, commit the
    # regenerated port. mantle is public, so this is a plain shallow checkout.
    name: theme sources match mantle main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: crossworks-engineering/mantle
          ref: main
          path: .mantle
          sparse-checkout: |
            packages/share-ui/styles/themes.css
            packages/share-ui/src/lib/theme-registry.gen.ts
          sparse-checkout-cone-mode: false

      - name: Compare
        run: |
          diff -u tool/themes/themes.css .mantle/packages/share-ui/styles/themes.css \
            && diff -u tool/themes/theme-registry.gen.ts .mantle/packages/share-ui/src/lib/theme-registry.gen.ts \
            || { echo '::error::tool/themes/ is behind mantle main. Run: tool/sync_themes.sh, then commit.'; exit 1; }
